<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pulse</title>

<style>
/* =========================================================
   PULSE — RETRO GAME UI
   Vanilla HTML / CSS / JS
   ========================================================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --orange: #ff7417;
  --orange-light: #ffad4a;
  --orange-dark: #df4e00;

  --cream: #fff1d2;
  --cream-light: #fff8e8;
  --paper: #ffe4af;

  --black: #17130f;
  --brown: #754522;

  --green: #62d957;
  --red: #ff5145;
  --yellow: #ffd43b;
  --blue: #69c8ff;

  --border: 3px solid var(--black);
  --shadow: 5px 5px 0 var(--black);
  --shadow-small: 3px 3px 0 var(--black);

  --radius: 14px;
}

html,
body {
  min-height: 100%;
}

body {
  font-family:
    "Arial Black",
    "Trebuchet MS",
    system-ui,
    sans-serif;

  color: var(--black);

  background-color: var(--cream);

  background-image:
    radial-gradient(
      circle,
      rgba(23, 19, 15, .08) 1.5px,
      transparent 1.5px
    );

  background-size: 18px 18px;

  overflow-x: hidden;
}

/* =========================================================
   APP
   ========================================================= */

.app {
  width: min(100%, 430px);
  min-height: 100vh;
  margin: auto;
  padding: 14px 14px 110px;
}

/* =========================================================
   DECORATION
   ========================================================= */

.star {
  position: fixed;
  z-index: -1;
  font-size: 26px;
  pointer-events: none;
}

.star.one {
  top: 80px;
  left: 10px;
  transform: rotate(-15deg);
}

.star.two {
  top: 290px;
  right: 8px;
  transform: rotate(18deg);
}

.star.three {
  bottom: 150px;
  left: 8px;
  transform: rotate(12deg);
  font-size: 18px;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.brand-icon {
  width: 40px;
  height: 40px;

  display: grid;
  place-items: center;

  background: var(--orange);
  border: var(--border);
  border-radius: 11px;

  box-shadow: var(--shadow-small);

  font-size: 22px;
}

.brand-name {
  font-size: 26px;
  line-height: 1;
  font-weight: 1000;
  letter-spacing: -1.5px;
}

.brand-sub {
  display: block;
  margin-top: 3px;
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.2px;
  opacity: .55;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.points-pill {
  display: flex;
  align-items: center;
  gap: 5px;

  padding: 8px 10px;

  background: var(--yellow);
  border: var(--border);
  border-radius: 10px;

  box-shadow: var(--shadow-small);

  font-size: 12px;
  font-weight: 1000;
}

.avatar-small {
  width: 39px;
  height: 39px;

  display: grid;
  place-items: center;

  background: var(--blue);
  border: var(--border);
  border-radius: 50%;

  box-shadow: 3px 3px 0 var(--black);

  font-size: 15px;
  font-weight: 1000;
}

/* =========================================================
   SCREEN
   ========================================================= */

.screen {
  display: none;
}

.screen.active {
  display: block;
}

/* =========================================================
   CARDS
   ========================================================= */

.card {
  position: relative;

  background: var(--cream-light);

  border: var(--border);
  border-radius: var(--radius);

  box-shadow: var(--shadow);

  padding: 17px;
  margin-bottom: 18px;
}

.card.orange {
  background: var(--orange);
}

.card.yellow {
  background: var(--yellow);
}

.card.blue {
  background: var(--blue);
}

/* =========================================================
   BITCOIN HERO
   ========================================================= */

.price-card {
  overflow: hidden;
  min-height: 235px;
}

.price-card::after {
  content: "₿";

  position: absolute;
  right: -12px;
  bottom: -30px;

  font-family: Arial, sans-serif;
  font-size: 180px;
  font-weight: 1000;

  color: rgba(23, 19, 15, .07);

  transform: rotate(-12deg);

  pointer-events: none;
}

.price-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  position: relative;
  z-index: 2;

  margin-bottom: 14px;
}

.coin-tag {
  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 12px;
  font-weight: 1000;
}

.btc-icon {
  width: 28px;
  height: 28px;

  display: grid;
  place-items: center;

  background: var(--orange);
  border: 2px solid var(--black);
  border-radius: 50%;

  font-size: 16px;
}

.live-badge {
  display: flex;
  align-items: center;
  gap: 5px;

  padding: 5px 8px;

  background: var(--green);
  border: 2px solid var(--black);
  border-radius: 7px;

  font-size: 9px;
  font-weight: 1000;
}

.live-dot {
  width: 7px;
  height: 7px;
  background: var(--black);
  border-radius: 50%;
  animation: blink .8s infinite;
}

@keyframes blink {
  50% {
    opacity: .25;
  }
}

.price-content {
  position: relative;
  z-index: 2;
}

.price-label {
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: 900;
  opacity: .55;
  letter-spacing: 1px;
}

.price-main {
  margin-top: 3px;

  font-size: clamp(34px, 10vw, 48px);
  line-height: .95;
  font-weight: 1000;
  letter-spacing: -3px;
}

.price-change {
  margin-top: 8px;

  font-family: Arial, sans-serif;
  font-size: 13px;
  font-weight: 900;
}

.price-change.up {
  color: #15951a;
}

.price-change.down {
  color: var(--red);
}

.mini-chart {
  height: 45px;

  display: flex;
  align-items: end;
  justify-content: flex-end;
  gap: 3px;

  margin-top: 12px;
}

.mini-chart-bar {
  width: 4px;
  background: var(--black);
  border-radius: 2px 2px 0 0;
  opacity: .75;
}

/* =========================================================
   MASCOT
   ========================================================= */

.mascot-wrap {
  position: absolute;
  right: 18px;
  bottom: 15px;

  z-index: 3;
}

.mascot {
  width: 90px;
  height: 90px;

  display: grid;
  place-items: center;

  background: var(--orange-light);

  border: 4px solid var(--black);
  border-radius: 50% 45% 48% 42%;

  box-shadow: 5px 5px 0 var(--black);

  font-size: 48px;

  transform: rotate(5deg);

  animation: mascotFloat 2.4s ease-in-out infinite;
}

@keyframes mascotFloat {
  0%, 100% {
    transform: rotate(5deg) translateY(0);
  }

  50% {
    transform: rotate(-3deg) translateY(-5px);
  }
}

/* =========================================================
   ROUND TIMER
   ========================================================= */

.timer-card {
  text-align: center;
  padding: 18px 14px 20px;
}

.timer-title {
  font-size: 12px;
  font-weight: 1000;
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom: 13px;
}

.timer-ring-wrap {
  width: 148px;
  height: 148px;

  margin: auto;

  position: relative;

  background: var(--orange-light);

  border: 4px solid var(--black);
  border-radius: 50%;

  box-shadow: 6px 6px 0 var(--black);
}

.timer-ring-svg {
  width: 148px;
  height: 148px;

  transform: rotate(-90deg);
}

.timer-ring-bg {
  fill: none;
  stroke: rgba(23,19,15,.13);
  stroke-width: 7;
}

.timer-ring-fill {
  fill: none;
  stroke: var(--black);
  stroke-width: 7;
  stroke-linecap: round;

  stroke-dasharray: 377;
  stroke-dashoffset: 0;

  transition: stroke-dashoffset 1s linear;
}

.timer-center {
  position: absolute;
  inset: 0;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.timer-label {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  text-transform: uppercase;
  opacity: .55;
}

.timer-value {
  margin-top: 3px;

  font-size: 35px;
  line-height: 1;
  font-weight: 1000;
  letter-spacing: -2px;
}

/* =========================================================
   DURATION
   ========================================================= */

.time-section {
  margin-bottom: 18px;
}

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 9px;
}

.section-heading h3 {
  font-size: 14px;
  font-weight: 1000;
  text-transform: uppercase;
}

.section-heading span {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  opacity: .5;
}

.time-options {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.time-btn {
  min-height: 57px;

  background: var(--cream-light);

  border: 3px solid var(--black);
  border-radius: 9px;

  box-shadow: 3px 3px 0 var(--black);

  color: var(--black);

  font-family: inherit;
  font-size: 13px;
  font-weight: 1000;

  cursor: pointer;

  transition:
    transform .1s,
    box-shadow .1s,
    background .1s;
}

.time-btn:active {
  transform: translate(2px,2px);
  box-shadow: 1px 1px 0 var(--black);
}

.time-btn.active {
  background: var(--orange);
}

.time-btn .reward {
  display: block;

  margin-top: 3px;

  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: 900;
  opacity: .65;
}

/* =========================================================
   PREDICTION BUTTONS
   ========================================================= */

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;

  margin-bottom: 18px;
}

.btn {
  min-height: 118px;

  position: relative;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  border: 4px solid var(--black);
  border-radius: 14px;

  color: var(--black);

  font-family: inherit;

  cursor: pointer;

  box-shadow: 6px 6px 0 var(--black);

  transition:
    transform .1s,
    box-shadow .1s;
}

.btn:active {
  transform: translate(5px,5px);
  box-shadow: 1px 1px 0 var(--black);
}

.btn-up {
  background: var(--green);
}

.btn-down {
  background: var(--red);
}

.btn-arrow {
  font-family: Arial, sans-serif;
  font-size: 34px;
  line-height: .8;
  font-weight: 1000;
}

.btn-label {
  font-size: 22px;
  font-weight: 1000;
  letter-spacing: 1px;
}

.btn-sub {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  opacity: .65;
}

/* =========================================================
   LOCKED STATE
   ========================================================= */

.locked-state {
  display: none;
}

.locked-state.show {
  display: block;
  text-align: center;
  background: var(--orange-light);
}

.locked-mascot {
  font-size: 55px;
  margin-bottom: 8px;
}

.locked-title {
  font-size: 19px;
  font-weight: 1000;
}

.locked-direction {
  margin-top: 4px;

  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 900;
}

.locked-timer {
  margin-top: 10px;

  font-size: 28px;
  font-weight: 1000;
}

/* =========================================================
   LAST ROUNDS
   ========================================================= */

.rounds-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.round-item {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 10px;

  padding: 11px;

  background: var(--cream-light);

  border: 3px solid var(--black);
  border-radius: 10px;

  box-shadow: var(--shadow-small);
}

.round-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.round-time {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  opacity: .5;
}

.round-price {
  font-size: 12px;
  font-weight: 1000;
}

.round-result {
  padding: 5px 7px;

  border: 2px solid var(--black);
  border-radius: 6px;

  font-size: 10px;
  font-weight: 1000;
}

.round-result.win {
  background: var(--green);
}

.round-result.loss {
  background: var(--red);
}

.round-pts {
  font-family: Arial, sans-serif;
  font-size: 10px;
  font-weight: 1000;
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-top {
  text-align: center;
  padding: 8px 0 18px;
}

.profile-avatar {
  width: 92px;
  height: 92px;

  display: grid;
  place-items: center;

  margin: auto;

  background: var(--blue);

  border: 4px solid var(--black);
  border-radius: 50%;

  box-shadow: 6px 6px 0 var(--black);

  font-size: 38px;
  font-weight: 1000;
}

.profile-name {
  margin-top: 14px;

  font-size: 22px;
  font-weight: 1000;
}

.profile-handle {
  margin-top: 2px;

  font-family: Arial, sans-serif;
  font-size: 11px;
  font-weight: 800;
  opacity: .5;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}

.stat-box {
  padding: 13px 5px;

  background: var(--cream-light);

  border: 3px solid var(--black);
  border-radius: 10px;

  box-shadow: var(--shadow-small);

  text-align: center;
}

.stat-value {
  font-size: 19px;
  font-weight: 1000;
}

.stat-label {
  margin-top: 4px;

  font-family: Arial, sans-serif;
  font-size: 8px;
  font-weight: 900;
  opacity: .55;
  text-transform: uppercase;
}

.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  margin-top: 16px;

  padding: 8px 12px;

  background: var(--orange);

  border: 3px solid var(--black);
  border-radius: 9px;

  box-shadow: var(--shadow-small);

  font-size: 11px;
  font-weight: 1000;
}

.level-bar {
  margin-top: 18px;
}

.level-header {
  display: flex;
  justify-content: space-between;

  margin-bottom: 6px;

  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
}

.level-track {
  height: 14px;

  background: var(--paper);

  border: 3px solid var(--black);
  border-radius: 7px;

  overflow: hidden;
}

.level-fill {
  width: 72%;
  height: 100%;

  background: var(--orange);

  border-right: 3px solid var(--black);
}

/* =========================================================
   LEADERBOARD
   ========================================================= */

.leader-title {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 16px;
}

.leader-title h2 {
  font-size: 22px;
  font-weight: 1000;
}

.leader-title span {
  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  opacity: .5;
}

.podium {
  display: flex;
  align-items: end;
  justify-content: center;

  gap: 8px;

  margin: 10px 0 24px;
}

.podium-item {
  width: 31%;
  text-align: center;
}

.podium-avatar {
  width: 55px;
  height: 55px;

  display: grid;
  place-items: center;

  margin: auto;

  border: 3px solid var(--black);
  border-radius: 50%;

  box-shadow: 3px 3px 0 var(--black);

  font-size: 18px;
  font-weight: 1000;
}

.podium-item:nth-child(1) .podium-avatar {
  background: var(--yellow);
}

.podium-item:nth-child(2) .podium-avatar {
  background: #d3d3d3;
}

.podium-item:nth-child(3) .podium-avatar {
  background: #d58a4c;
}

.podium-rank {
  margin-top: 7px;

  font-size: 12px;
  font-weight: 1000;
}

.podium-name {
  margin-top: 3px;

  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
}

.podium-pts {
  margin-top: 3px;

  font-size: 10px;
  font-weight: 1000;
}

.leader-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.leader-item {
  display: flex;
  align-items: center;
  gap: 9px;

  padding: 9px;

  background: var(--cream-light);

  border: 3px solid var(--black);
  border-radius: 10px;

  box-shadow: 3px 3px 0 var(--black);
}

.leader-item.you {
  background: var(--orange-light);
}

.leader-rank {
  width: 25px;

  font-size: 12px;
  font-weight: 1000;
  text-align: center;
}

.leader-avatar {
  width: 36px;
  height: 36px;

  display: grid;
  place-items: center;

  background: var(--blue);

  border: 2px solid var(--black);
  border-radius: 50%;

  font-size: 11px;
  font-weight: 1000;
}

.leader-info {
  flex: 1;
}

.leader-name {
  font-size: 11px;
  font-weight: 1000;
}

.leader-pts {
  margin-top: 2px;

  font-family: Arial, sans-serif;
  font-size: 9px;
  font-weight: 900;
  opacity: .55;
}

.you-badge {
  display: inline-block;

  margin-left: 4px;
  padding: 2px 4px;

  background: var(--black);
  color: var(--cream);

  border-radius: 3px;

  font-size: 7px;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {
  position: fixed;

  z-index: 50;

  left: 50%;
  bottom: 0;

  transform: translateX(-50%);

  width: min(100%, 430px);

  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 7px;

  padding: 8px 12px 18px;

  background: var(--orange);

  border-top: 3px solid var(--black);
}

.nav-item {
  min-height: 49px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  gap: 3px;

  background: transparent;

  border: 0;
  border-radius: 9px;

  color: rgba(23,19,15,.55);

  font-family: inherit;
  font-size: 9px;
  font-weight: 1000;
  text-transform: uppercase;

  cursor: pointer;
}

.nav-icon {
  font-size: 19px;
  line-height: 1;
}

.nav-item.active {
  background: var(--cream-light);
  color: var(--black);

  border: 2px solid var(--black);

  box-shadow: 3px 3px 0 var(--black);
}

/* =========================================================
   RESULT OVERLAY
   ========================================================= */

.result-overlay {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(23,19,15,.72);
}

.result-overlay.show {
  display: flex;
}

.result-box {
  width: min(100%, 350px);

  padding: 25px 20px;

  background: var(--cream);

  border: 4px solid var(--black);
  border-radius: 17px;

  box-shadow: 9px 9px 0 var(--black);

  text-align: center;

  animation: pop .25s ease-out;
}

@keyframes pop {
  from {
    transform: scale(.75) rotate(-3deg);
    opacity: 0;
  }

  to {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

.result-mascot {
  font-size: 65px;
  line-height: 1;
}

.result-title {
  margin-top: 12px;

  font-size: 31px;
  font-weight: 1000;
  letter-spacing: -1px;
}

.result-title.win {
  color: #168b20;
}

.result-title.loss {
  color: var(--red);
}

.result-details {
  margin-top: 8px;

  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 800;
  opacity: .6;
}

.result-points {
  margin: 15px 0;

  font-size: 23px;
  font-weight: 1000;
}

.btn-close {
  width: 100%;

  padding: 14px;

  background: var(--orange);

  border: 3px solid var(--black);
  border-radius: 10px;

  box-shadow: 4px 4px 0 var(--black);

  color: var(--black);

  font-family: inherit;
  font-size: 15px;
  font-weight: 1000;

  cursor: pointer;
}

.btn-close:active {
  transform: translate(3px,3px);
  box-shadow: 1px 1px 0 var(--black);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 350px) {

  .app {
    padding-left: 10px;
    padding-right: 10px;
  }

  .price-main {
    font-size: 32px;
  }

  .mascot {
    width: 72px;
    height: 72px;
    font-size: 38px;
  }

  .time-btn {
    font-size: 11px;
  }

  .btn {
    min-height: 105px;
  }
}
</style>
</head>

<body>

<div class="star one">✦</div>
<div class="star two">✦</div>
<div class="star three">✦</div>

<div class="app">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="header">

    <div class="brand">

      <div class="brand-icon">⚡</div>

      <div>
        <div class="brand-name">PULSE</div>
        <span class="brand-sub">PREDICT THE MOVE</span>
      </div>
